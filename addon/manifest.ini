name = accessibleWebpage
summary = "Accessible Webpage Rebuilder"
description = """Rebuilds inaccessible web pages as clean, accessible HTML using an LLM (Google Gemini, OpenAI, or a local model through Ollama or an OpenAI-compatible server), and passes your interactions back to the original page. Long pages load in parts with a Load more button. Press NVDA+shift+c on a web page, or NVDA+shift+alt+c for a tree of its sections and controls."""
